{% extends 'layout.html' %}
{% block content %}
    <div class="container mt-4">
        <div class="card shadow-sm border-0 mx-auto" style="max-width: 650px;">
            <div class="card-body p-4">
                <h2 class="h4 mb-1">Edit Category</h2>
                <p class="text-muted mb-4">Update category information.</p>
                <form role="form" method="post" action="{% url 'update_category' %}">
                    {% csrf_token %}
                    <input type="hidden" name="txt_id" value="{{ category.id }}">
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" name="txt_name" class="form-control" placeholder="Category Name" value="{{ category.name }}" required>
                    </div>
                    <div class="d-flex flex-wrap gap-2 form-actions">
                        <button type="submit" class="btn btn-success">Update Category</button>
                        <a href="{% url 'category_list' %}" class="btn btn-outline-secondary">Back to Category List</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
