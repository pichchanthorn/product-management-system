{% extends 'layout.html' %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="mb-3">Add Category</h3>
                    <form role="form" method="post" action="{% url 'save_category' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Category Name</label>
                            <input type="text" name="txt_name" class="form-control" placeholder="Enter category name">
                        </div>
                        <div class="d-flex flex-wrap gap-2 form-actions">
                            <button type="submit" class="btn btn-success">Submit</button>
                            <a href="{% url 'category_list' %}" class="btn btn-outline-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
