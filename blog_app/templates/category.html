{% extends 'layout.html' %}
{% block content %}
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3 page-header">
        <div>
            <h3 class="mb-1">Category List</h3>
            <p class="text-muted mb-0">Organize products by category for easier stock management.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a href="{% url 'deleted_category_list' %}" class="btn btn-outline-secondary">Deleted Categories</a>
            <a href="{% url 'add_category' %}" class="btn btn-success">Add Category</a>
        </div>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle mb-0">
                    <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
                    </thead>
                    <tbody>
                        {% for row in data %}
                        <tr>
                            <td class="fw-semibold">{{ forloop.counter }}</td>
                            <td>{{ row.name }}</td>
                            <td>
                                <a href="{% url 'edit_category' row.id %}" class="btn btn-outline-info btn-sm">Edit</a>
                                <a href="{% url 'delete_category' row.id %}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to move this category to Trash?');">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
{% endblock %}
