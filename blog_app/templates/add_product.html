{% extends 'layout.html' %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="mb-3">Add Product</h3>
                    <form role="form" method="post" action="{% url 'save_product' %}">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text" name="txt_product_name" class="form-control" placeholder="Enter product name">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Barcode</label>
                                <input type="text" name="txt_barcode" class="form-control" placeholder="Enter barcode">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Price</label>
                                <input type="number" step="0.01" name="txt_price" class="form-control" placeholder="0.00">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Cost</label>
                                <input type="number" step="0.01" name="txt_cost" class="form-control" placeholder="0.00">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Qty</label>
                                <input type="number" name="txt_qty" class="form-control" placeholder="0">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Unit</label>
                                <input type="text" name="txt_unit" class="form-control" placeholder="pcs, box">
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label">Description</label>
                                <textarea name="txt_description" class="form-control" placeholder="Add a short description" rows="3"></textarea>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select name="txt_category_id" class="form-select">
                                    <option value="">-- Select Category --</option>
                                    {% for category in categories %}
                                        <option value="{{ category.id }}">{{ category.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="d-flex flex-wrap gap-2 form-actions">
                            <button type="submit" class="btn btn-success">Submit</button>
                            <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
